name: Windows build

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Frontend unit tests (calculator parser, unit conversion). The typecheck runs inside `tauri build`.
      - run: npm test
      # Rust: unit tests for the trigger state machine, run on Windows itself.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: wheelie-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: wheelie-windows-portable-exe
          path: src-tauri/target/release/wheelie.exe
          if-no-files-found: error
