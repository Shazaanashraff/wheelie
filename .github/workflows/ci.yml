name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast checks on Linux: the UI code is plain TypeScript and runs anywhere.
  frontend:
    name: Typecheck, test, build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The real app is Windows-only (global hooks), so it is built and tested on Windows.
  windows:
    name: Rust tests and installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build

      # Test builds, for trying a pull request. Real releases come from release.yml.
      - uses: actions/upload-artifact@v4
        with:
          name: wheelie-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: wheelie-windows-portable-exe
          path: src-tauri/target/release/wheelie.exe
          if-no-files-found: error
          retention-days: 14
